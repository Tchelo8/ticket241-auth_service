# Modèle des secrets d'auth-service (versionné, SANS valeurs).
#
# En local : copier ce fichier en config/application.yaml (ignoré par Git) et remplir les valeurs.
# Sur un serveur : définir les variables d'environnement indiquées à la place.
#
# Générer une clé (PowerShell) :
#   $b = New-Object byte[] 64; [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b); [Convert]::ToBase64String($b)
spring:
  datasource:
    # Variable d'environnement : DB_PASSWORD
    password: <DB_PASSWORD>
notification:
  internal:
    # Variable d'environnement : INTERNAL_API_KEY
    # IDENTIQUE dans auth-service, notification-service et ticket-service
    api-key: <INTERNAL_API_KEY>
jwt:
  # Variable d'environnement : JWT_SECRET
  # Clé Base64 d'au moins 32 octets aléatoires, IDENTIQUE à celle de l'api-gateway
  secret: <JWT_SECRET>
