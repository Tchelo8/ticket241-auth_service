server:
  port: 8083
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service_db
    username: postgres
    # Secrets : variables d'environnement ou fichier local config/application.yaml (voir config/secrets.example.yaml)
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false


eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8781/eureka/

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

kafka:
  enabled: true
  topics:
    user-registered: user.registered

# Appel synchrone vers notification-service pour la vérification de l'OTP à l'inscription
notification:
  service:
    base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:9004}
  # Doit être IDENTIQUE dans auth-service, notification-service et ticket-service
  internal:
    api-key: ${INTERNAL_API_KEY}

jwt:
  # Clé HMAC encodée en Base64, au moins 256 bits (64 octets générés). Doit être IDENTIQUE à celle de la gateway.
  # Pas de valeur par défaut : sans secret, le service refuse de démarrer plutôt que de signer avec une clé connue
  secret: ${JWT_SECRET}
  expiration: 86400000  # 24 heures en millisecondes (24 * 60 * 60 * 1000)