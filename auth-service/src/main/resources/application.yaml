server:
  port: 8083
spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_service_db
    username: postgres
    password: azerty
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false


eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8781/eureka/

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

kafka:
  enabled: true
  topics:
    user-registered: user.registered

# Appel synchrone vers notification-service pour la vérification de l'OTP à l'inscription
notification:
  service:
    base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:9004}
  # Doit être IDENTIQUE à notification.internal.api-key côté notification-service
  internal:
    api-key: ${INTERNAL_API_KEY:change-me-in-production}

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  # Clé secrète de 256 bits encodée en hexadécimal
  # EN PRODUCTION : je vais utiliser Spring Cloud Config ou un vault
  expiration: 86400000  # 24 heures en millisecondes (24 * 60 * 60 * 1000)